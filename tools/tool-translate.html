<!DOCTYPE html>
<html lang="zh-CN" style="font-size: 16px; --toolbar-h: 39px;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻译推理知识点整理</title>
<script src="../cloud-localstorage-sync.js" data-tool="translate"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&amp;family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'MyFont';
    src:url('../fonts/新海山峦.ttf') format('truetype');
    font-weight:400 900;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --bg-a:#D8EAF6;
    --bg-b:#F5E1E9;
    --paper:#F6F4FA;
    --card:#FFFFFF;
    --ink:#302D48;
    --ink-soft:#726F8C;
    --ink-faint:#AEABC3;
    --indigo:#3B375C;
    --indigo-soft:#57527D;
    --indigo-tint:#EDECF5;
    --seal:#C97D93;
    --seal-tint:#F8E9ED;
    --teal:#6BA599;
    --teal-tint:#E7F1EE;
    --coral:#D3946E;
    --coral-tint:#F6EDE3;
    --purple:#9089B0;
    --purple-tint:#EFEDF5;
    --amber:#C4A25F;
    --amber-tint:#F6F0DF;
    --rule:#EAE7F1;
    --rule-strong:#DBD7E8;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; font-size:16px;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 6% 4%, var(--bg-a) 0%, transparent 42%),
      radial-gradient(circle at 96% 92%, var(--bg-b) 0%, transparent 48%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'MyFont','Noto Sans SC', sans-serif;
    line-height:1.65;
    padding-bottom:80px;
  }
  .shell{
    max-width:1220px;
    margin:0 auto;
    padding:0 14px;
    display:grid;
    grid-template-columns:270px 1fr;
    gap:24px;
    transition:grid-template-columns .25s ease;
  }
  .shell.toc-collapsed{grid-template-columns:56px 1fr;}
  header{
    grid-column:1 / -1; padding:36px 24px 26px; position:relative;
    border-radius:22px; margin-bottom:6px;
    background:linear-gradient(165deg, #ffffff 0%, var(--paper) 65%, #F1EEF8 100%);
    box-shadow:0 18px 38px rgba(75,63,224,0.12), 0 1px 0 rgba(255,255,255,0.7) inset;
  }
  body.skin-y2k header{background:#fff; box-shadow:0 10px 26px rgba(0,0,0,.08);}
  html, body{overflow-x:hidden;}

  /* ---- CD 光盘：Y2K 皮肤下的悬浮菜单入口（还原为标题区大图案） ---- */
  .cd-menu{display:none;}
  body.skin-y2k .cd-menu{
    display:block; position:absolute; top:-18px; right:-108px; width:216px; height:216px;
    z-index:50; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  body.skin-y2k.pinned .cd-menu{opacity:0; transform:scale(.35) translateY(-24px); pointer-events:none;}
  .cd-decor{
    display:block; width:100%; height:100%; pointer-events:auto;
    border-radius:50%; object-fit:cover;
    transform:rotate(-10deg); box-shadow:0 6px 18px rgba(0,0,0,.12);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .cd-menu:hover .cd-decor, .cd-menu.cd-open .cd-decor, .cd-menu:focus-within .cd-decor{
    transform:rotate(-2deg) scale(1.04);
    box-shadow:0 10px 26px rgba(0,0,0,.18);
  }
  .cd-panel{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .cd-panel.cd-panel--floating{
    position:absolute; top:56%; right:32%; width:208px;
    flex-direction:column; align-items:stretch; gap:8px;
    background:#fff; border-radius:16px; padding:12px;
    box-shadow:0 14px 34px rgba(0,0,0,.16);
    opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px);
    transition:opacity .15s ease, visibility .15s ease, transform .15s ease;
    z-index:51;
  }
  .cd-menu:hover .cd-panel--floating,
  .cd-menu:focus-within .cd-panel--floating,
  .cd-menu.cd-open .cd-panel--floating{
    opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0);
  }
  .cd-panel--floating .skin-switch, .cd-panel--floating .font-size-control{
    width:100%; justify-content:center;
  }
  .cd-panel--floating > button{width:100%; justify-content:flex-start;}
  @media (max-width:860px){
    .cd-menu{display:none !important;}
  }

  /* ---- 固定工具栏右端的迷你 CD（吸顶后出现，替代原先悬浮右上角的做法） ---- */
  .cd-dock{
    display:none; position:relative; margin-left:auto; flex-shrink:0;
    width:0; height:0; opacity:0; pointer-events:none;
    transition:opacity .25s ease, width .25s ease, height .25s ease;
  }
  body.skin-y2k .toolbar.pinned .cd-dock{
    display:block; width:36px; height:36px; opacity:1; pointer-events:auto;
    position:absolute; top:100%; right:14px; margin-top:6px;
  }
  .cd-dock:hover .cd-decor, .cd-dock.cd-open .cd-decor, .cd-dock:focus-within .cd-decor{
    transform:rotate(-2deg) scale(1.08);
    box-shadow:0 8px 18px rgba(0,0,0,.22);
  }
  .cd-dock .cd-panel.cd-panel--floating{
    position:absolute; top:calc(100% + 10px); right:0; left:auto; transform:none;
  }
  .cd-dock:hover .cd-panel--floating,
  .cd-dock:focus-within .cd-panel--floating,
  .cd-dock.cd-open .cd-panel--floating{
    opacity:1; visibility:visible; pointer-events:auto;
  }
  @media (max-width:860px){
    .cd-dock{display:none !important;}
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--indigo-soft); margin:0 0 10px;
    display:inline-flex; align-items:center; gap:6px;
    background:var(--indigo-tint); padding:5px 12px; border-radius:20px;
  }
  h1{
    font-family:'MyFont','Noto Serif SC',serif; font-weight:700; font-size:2.375rem;
    margin:14px 0 8px; letter-spacing:.01em;
    background:linear-gradient(90deg, var(--indigo) 0%, var(--seal) 120%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{color:var(--ink-soft); font-size:0.875rem; max-width:560px;}

  .toolbar{
    grid-column:1 / -1;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    padding:14px 14px 24px; margin:0 -14px 8px; margin-top:0;
    border-bottom:1px solid var(--rule-strong);
    position:relative; z-index:30;
    background:var(--paper);
  }
  body.skin-y2k .toolbar{background:#fff;}
  body.skin-y2k .toolbar.pinned{
    position:fixed; top:0; margin:0; padding:0; min-height:0;
    background:transparent; border-radius:0;
    box-shadow:none;
  }
  #toolbarSpacer{height:0; grid-column:1 / -1;}
  button{
    font-family:'MyFont','Noto Sans SC',sans-serif; font-size:0.8125rem; cursor:pointer;
    border-radius:10px; padding:9px 15px;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  button:active{transform:scale(0.97);}
  button.icon-only{padding:9px 11px; gap:0;}
  button.icon-only i{font-size:1rem;}
  .svgi{width:16px; height:16px; display:block; flex-shrink:0;}
  .svgi.svgi-sm{width:13px; height:13px;}
  button.icon-only .svgi{width:17px; height:17px;}
  .mark-toggle.icon-only{gap:4px;}
  .btn-primary{background:var(--indigo); color:#fff; border:none; box-shadow:0 6px 16px rgba(75,63,224,0.25);}
  .btn-primary:hover{background:var(--indigo-soft);}
  .btn-ghost{background:#fff; color:var(--ink-soft); border:none; box-shadow:0 1px 3px rgba(75,63,224,0.08);}
  .btn-ghost:hover{color:var(--seal); background:var(--seal-tint);}
  .btn-seal{background:#fff; color:var(--seal); border:none; box-shadow:0 1px 3px rgba(75,63,224,0.08);}
  .btn-seal:hover{background:var(--seal-tint);}
  .btn-ghost.active{background:var(--seal); color:#fff; box-shadow:none;}
  .btn-ghost.active:hover{background:var(--seal);}

  mark.hl{
    background:#FDE68A; color:inherit; padding:0 2px; border-radius:3px;
    box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }
  body.highlight-mode mark.hl{cursor:pointer;}
  body.highlight-mode #sections{cursor:text;}

  .font-size-control{
    display:inline-flex; align-items:center; gap:2px;
    background:#fff; border:none; box-shadow:0 1px 3px rgba(75,63,224,0.08); border-radius:10px; padding:3px;
  }
  .font-size-control button{
    padding:7px 12px; border:none; background:transparent; color:var(--ink-soft); border-radius:7px;
    font-size:0.8125rem;
  }
  .font-size-control button:hover{background:var(--seal-tint); color:var(--seal);}
  .font-size-control button.active{background:var(--seal); color:#fff;}
  /* .editing-only is now scoped to delete buttons specifically — content itself is
     always editable, .edit-mode just means "deletion is unlocked". */
  body:not(.edit-mode) .editing-only{display:none !important;}
  [contenteditable="true"]{cursor:text;}
  [contenteditable="false"]{cursor:default;}

  /* ---- Sidebar TOC ---- */
  nav#toc{
    grid-column:1; align-self:start;
    position:relative;
    display:flex; flex-direction:column; gap:2px;
    padding:14px 10px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:16px;
    box-shadow:0 8px 24px rgba(75,63,224,0.06);
    overflow:visible;
  }
  body.skin-y2k nav#toc.pinned{
    position:fixed; z-index:29;
    transition:top .22s ease;
  }
  main{grid-column:2;}
  nav#toc .toc-top{display:flex; align-items:center; justify-content:space-between; padding:0 4px 8px;}
  #tocList{display:flex; flex-direction:column; gap:2px;}
  .toc-toggle{
    width:26px; height:26px; border-radius:8px; padding:0; flex-shrink:0;
    background:var(--indigo-tint); color:var(--indigo-soft); border:none;
    display:flex; align-items:center; justify-content:center;
  }
  .toc-toggle:hover{background:var(--indigo); color:#fff;}
  .toc-toggle-arrow{display:inline-block; font-size:15px; font-weight:700; line-height:1; transition:transform .25s ease;}
  .shell.toc-collapsed .toc-toggle-arrow{transform:rotate(180deg);}
  nav#toc a{transition:color .18s ease,font-weight .18s ease;
    display:flex; align-items:flex-start; gap:8px;
    font-size:0.8125rem; color:var(--ink-soft); text-decoration:none;
    padding:8px 10px;
    border-radius:9px;
    white-space:normal;
    line-height:1.35;
  }
  nav#toc a .num{margin-top:1px;}
  nav#toc a:hover{color:var(--indigo); background:var(--indigo-tint);}
  nav#toc a.active{color:var(--seal); font-weight:700;}
  nav#toc a.active .num{background:var(--seal); color:#fff;}
  nav#toc a .num{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.6875rem; color:var(--indigo-soft);
    width:20px; height:20px; border-radius:6px; flex-shrink:0;
    background:var(--indigo-tint);
    display:flex; align-items:center; justify-content:center;
  }
  .toc-fly{
    display:inline-flex; align-items:center; opacity:0; width:0; overflow:hidden;
    transition:opacity .15s ease, width .15s ease; color:inherit; flex-shrink:0; margin-top:2px;
  }
  .toc-fly svg{width:12px; height:12px; display:block;}
  /* Y2K: hover no longer fills a color block — just recolor text + reveal a trailing butterfly */
  body.skin-y2k nav#toc a:hover{background:transparent; color:var(--ink);}
  body.skin-y2k nav#toc a:hover .num{background:#111; color:#fff;}
  body.skin-y2k nav#toc a:hover .toc-fly{opacity:.85; width:14px; margin-left:2px;}
  body.skin-y2k nav#toc a[data-accent="pink"]:hover{color:#111111;}
  body.skin-y2k nav#toc a .num{background:#F1F1EF; color:#5A5A57;}
  nav#toc .toc-label{font-size:0.6875rem; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; padding:0 6px 8px;}
  .shell.toc-collapsed nav#toc{padding:14px 6px;}
  .shell.toc-collapsed .toc-label, .shell.toc-collapsed nav#toc a .label{display:none;}
  .shell.toc-collapsed nav#toc a{transition:color .18s ease,font-weight .18s ease;justify-content:center; padding:8px 0;}
  .shell.toc-collapsed nav#toc .toc-top{justify-content:center;}

  /* ---- 目录下方的标注工具行 ---- */
  .toc-controls-row{
    margin-top:8px; padding-top:10px; border-top:1px dashed var(--rule-strong);
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
  }
  .shell.toc-collapsed .toc-controls-row{display:none;}
  body.skin-y2k .toc-controls-row button,
  body.skin-y2k .toc-controls-row .mark-caret{border-radius:12px; box-shadow:none;}

  main{min-width:0;}
  #sections{display:flex; flex-direction:column; gap:22px;}

  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:18px;
    padding:0; overflow:hidden;
    box-shadow:0 6px 22px rgba(75,63,224,0.06);
    scroll-margin-top:24px;
  }
  .card-head{
    padding:0; border-bottom:1px solid var(--rule);
    background:linear-gradient(180deg, rgba(108,99,255,0.05), transparent);
    position:relative; overflow:hidden;
  }
  .card-head-row{
    display:flex; align-items:center; gap:12px;
    padding:16px 20px; position:relative; z-index:1;
  }
  .num-badge{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.8125rem;
    color:#fff; background:linear-gradient(135deg, var(--indigo) 0%, var(--indigo-soft) 100%);
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card-title{
    font-family:'MyFont','Noto Serif SC',serif; font-weight:700; font-size:1.0625rem; color:var(--ink);
    outline:none; flex:1; min-width:0; padding:2px 4px; border-radius:4px;
  }
  .card-title:focus{background:var(--indigo-tint);}
  .card-body{padding:18px 20px 16px;}

  .icon-btn{
    background:transparent; border:none; color:var(--ink-faint);
    padding:5px; border-radius:8px; font-size:0.9375rem; line-height:1; flex-shrink:0;
  }
  .icon-btn:hover{color:var(--seal); background:var(--seal-tint);}

  /* ---- term/detail row (used in list + compare) ---- */
  .row{
    display:flex; align-items:flex-start; gap:10px;
    padding:7px 8px; border-radius:9px;
  }
  .row:hover{background:var(--indigo-tint);}
  .term-badge{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.78125rem;
    padding:4px 8px; border-radius:7px; white-space:nowrap;
    outline:none; min-width:34px; text-align:center; flex-shrink:0;
    margin-top:1px;
  }
  .detail-text{flex:1; outline:none; font-size:0.875rem; color:var(--ink); padding:4px 2px; border-radius:4px;}
  .detail-text:focus, .term-badge:focus{background:rgba(108,99,255,0.12);}
  .detail-text:empty:before{content:"说明文字…"; color:var(--ink-faint);}
  .row .del-item{
    opacity:1;
    margin-top:2px;
    color:var(--seal);
    background:var(--seal-tint);
  }

  .add-row-btn{
    background:transparent; border:none; color:var(--indigo-soft); font-size:0.78125rem; padding:5px 6px; margin-top:2px;
  }
  .add-row-btn:hover{color:var(--indigo); text-decoration:underline;}

  /* ---- per-card supplementary notes (independent of edit lock) ---- */
  .supp-wrap{border-top:1px solid var(--rule);}
  .supp-toggle{
    width:100%; display:flex; align-items:center; gap:6px;
    background:transparent; border:none; cursor:pointer;
    padding:10px 20px; font-size:0.8125rem; color:var(--seal);
    justify-content:flex-start; border-radius:0;
  }
  .supp-toggle:hover{color:var(--seal); background:var(--seal-tint);}
  .supp-toggle .plus-icon{
    font-size:1.0625rem; font-weight:700; line-height:1; color:var(--seal);
    transition:transform .2s ease; display:inline-block;
  }
  .supp-wrap.open .supp-toggle{color:var(--seal);}
  .supp-wrap.open .supp-toggle .plus-icon{transform:rotate(45deg);}
  .supp-body{padding:0 20px 16px;}
  .supp-text{
    min-height:52px; border-radius:10px; padding:10px 12px;
    background:var(--amber-tint); border:1px dashed var(--amber);
    font-size:0.875rem; line-height:1.6; color:var(--ink); outline:none; white-space:pre-wrap;
  }
  .supp-text:focus{background:#fff; border-style:solid;}
  .supp-text:empty:before{content:attr(data-placeholder); color:var(--ink-faint);}
  .col .supp-wrap{border-top:1px dashed rgba(0,0,0,0.12); margin-top:4px;}
  .col .supp-toggle{padding:6px 2px; font-size:0.75rem; color:var(--seal);}
  .col .supp-toggle .plus-icon{font-size:0.875rem;}
  .col .supp-body{padding:0 2px 4px;}
  .col .supp-text{font-size:0.8125rem; min-height:40px; padding:8px 10px;}

  /* ---- compare (2-column) ---- */
  .compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .col{border-radius:14px; padding:12px 12px 8px; border:1px solid var(--rule-strong);}
  .col-head{
    display:flex; align-items:center; justify-content:flex-start; gap:6px; margin-bottom:6px;
  }
  .col-title{font-family:'MyFont','Noto Serif SC',serif; font-weight:700; font-size:0.84375rem; outline:none; padding:1px 3px; border-radius:4px;}
  .col-title:focus{background:rgba(0,0,0,0.06);}
  /* "两栏，无小标题" 板块：不显示标题行，保持干净；把鼠标移到这一栏上（或点进去）才露出来，方便随时补一个标题 */
  .col-head:has(.col-title:empty){display:none;}
  .col:hover .col-head:has(.col-title:empty),
  .col:focus-within .col-head:has(.col-title:empty){display:flex;}
  .col-title:empty:before{content:"小标题…"; color:var(--ink-faint);}
  .col-teal{background:var(--teal-tint); border-color:#BEE8DD;} .col-teal .col-title, .col-teal .term-badge{color:var(--teal);}
  .col-coral{background:var(--coral-tint); border-color:#F5CCAE;} .col-coral .col-title, .col-coral .term-badge{color:var(--coral);}
  .col-purple{background:var(--purple-tint); border-color:#DACBF9;} .col-purple .col-title, .col-purple .term-badge{color:var(--purple);}
  .col-amber{background:var(--amber-tint); border-color:#EDD293;} .col-amber .col-title, .col-amber .term-badge{color:var(--amber);}
  .col .term-badge{background:rgba(255,255,255,0.75);}

  .note-box{
    margin-top:12px; padding:10px 12px; border-radius:12px;
    background:var(--seal-tint); border:1px dashed var(--seal);
    font-size:0.8125rem; color:#7C4A57; display:flex; gap:8px; align-items:flex-start;
  }
  .note-box svg{color:var(--seal); margin-top:2px; flex-shrink:0;}
  .note-box .detail-text{color:#7C4A57;}
  .note-box .detail-text:empty:before{color:#CBA2AC;}

  /* ---- table type ---- */
  table.kv{width:100%; border-collapse:collapse; font-size:0.84375rem;}
  table.kv th{
    text-align:left; padding:8px 10px; font-weight:500; color:var(--ink-soft);
    border-bottom:1px solid var(--rule-strong); font-size:0.75rem; letter-spacing:.03em;
  }
  table.kv td{padding:8px 10px; border-bottom:1px solid var(--rule); outline:none; border-radius:4px;}
  table.kv td:focus{background:var(--indigo-tint);}
  table.kv tr:last-child td{border-bottom:none;}
  table.kv td.danger{color:var(--seal); font-weight:500;}
  table.kv .row-del{text-align:right; width:28px;}

  footer{
    max-width:1220px; margin:36px auto 0; padding:0 14px 0 308px;
    color:var(--ink-faint); font-size:0.75rem;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:860px){
    .shell{grid-template-columns:1fr;}
    .shell.toc-collapsed{grid-template-columns:1fr;}
    nav#toc{position:static; padding:12px;}
    nav#toc .toc-top{padding:0 2px 8px;}
    #tocList{display:flex; flex-direction:row; flex-wrap:wrap; gap:6px; max-height:none; overflow:visible;}
    nav#toc a{transition:color .18s ease,font-weight .18s ease;
      flex-direction:row; white-space:nowrap; border-radius:20px;
      padding:6px 12px 6px 6px; background:var(--indigo-tint);
      font-size:0.78125rem;
    }
    nav#toc a:hover{background:var(--indigo); color:#fff;}
    nav#toc a:hover .num{background:rgba(255,255,255,0.25); color:#fff;}
    .shell.toc-collapsed nav#toc a .label{display:inline;}
    .shell.toc-collapsed #tocList{flex-direction:row;}
    .shell.toc-collapsed nav#toc a{transition:color .18s ease,font-weight .18s ease;justify-content:flex-start; padding:6px 12px 6px 6px;}
    .toc-toggle{display:none;}
    footer{padding-left:24px;}
    .compare-grid{grid-template-columns:1fr;}
  }

  @media print{
    body{background:#fff;}
    .toolbar, .icon-btn, .add-row-btn, nav#toc, .drag-handle{display:none !important;}
    .shell{grid-template-columns:1fr;}
    .card{break-inside:avoid;}
  }

  /* ============ 皮肤切换 / 通用新交互 样式 ============ */
  .skin-switch{
    display:inline-flex; align-items:center; gap:2px;
    background:#fff; border:none; box-shadow:0 1px 3px rgba(75,63,224,0.08); border-radius:10px; padding:3px;
  }
  .skin-switch button{
    padding:7px 12px; border:none; background:transparent; color:var(--ink-soft); border-radius:7px;
    font-size:0.8125rem;
  }
  .skin-switch button:hover{background:var(--seal-tint); color:var(--seal);}
  .skin-switch button.active{background:var(--seal); color:#fff;}

  /* drag handle: shared by both skins, only visible on hover of its row/col/section */
  .drag-handle{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:18px; height:18px; opacity:0; color:var(--ink-faint); cursor:grab;
    transition:opacity .15s ease, color .15s ease; margin-top:1px;
  }
  .drag-handle svg{width:15px; height:15px; display:block;}
  .drag-handle:hover{color:var(--seal); opacity:1 !important;}
  .drag-handle:active{cursor:grabbing;}
  .row:hover .drag-handle,
  .col-head:hover .drag-handle,
  .card-head-row:hover .drag-handle{opacity:.6;}
  .row.is-dragging, .col.is-dragging, .card.is-dragging{opacity:.45;}
  body.dragging-active, body.dragging-active *{cursor:grabbing !important;}
  body.dragging-active [contenteditable]{cursor:grabbing !important;}

  /* highlight / underline mark-tool popovers */
  .mark-tool{position:relative; display:inline-flex; align-items:stretch;}
  .mark-toggle{border-radius:10px 0 0 10px !important; padding-right:8px !important;}
  .mark-toggle.active{background:var(--seal); color:#fff;}
  .mark-caret{
    border-radius:0 10px 10px 0 !important; padding:9px 8px !important;
  }
  .color-dot{
    width:9px; height:9px; border-radius:50%; display:inline-block; margin-left:2px;
    border:1px solid rgba(0,0,0,0.15);
  }
  .mark-popover{
    position:absolute; top:calc(100% + 6px); left:0; z-index:40;
    background:#fff; border:none; border-radius:12px;
    box-shadow:0 10px 28px rgba(75,63,224,0.16); padding:10px; min-width:170px;
    opacity:0; visibility:hidden; transform:translateY(-4px); pointer-events:none;
    transition:opacity .15s ease, visibility .15s ease, transform .15s ease;
  }
  .mark-tool:hover .mark-popover,
  .mark-tool:focus-within .mark-popover,
  .mark-popover.open{
    opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto;
  }
  .swatch-row{display:flex; gap:8px; margin-bottom:6px;}
  .swatch-row:last-child{margin-bottom:0;}
  .layout-popover{left:auto; right:0; min-width:180px; display:flex; flex-direction:column; gap:4px;}
  .layout-popover button{text-align:left; width:100%;}
  .layout-popover button.active{background:var(--seal); color:#fff;}
  .card[data-type="table"] .layout-tool{display:none;}
  .swatch{
    width:22px; height:22px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);
  }
  .swatch.selected{border-color:var(--seal);}
  .style-row{display:flex; gap:6px; padding-top:8px; border-top:1px dashed var(--rule-strong);}
  .style-btn{
    flex:1; padding:6px 4px; font-size:0.75rem; border:none; background:var(--paper);
    color:var(--ink-soft); border-radius:8px;
  }
  .style-btn.active{background:var(--seal); color:#fff;}
  body.highlight-mode mark.hl{cursor:pointer;}
  body.underline-mode span.ul{cursor:pointer;}
  body.highlight-mode #sections, body.underline-mode #sections{cursor:text;}
  body.eraser-mode mark.hl, body.eraser-mode span.ul{cursor:pointer;}
  body.eraser-mode #sections{cursor:crosshair;}

  /* chrome bars exist in the DOM regardless of skin (so labels survive skin switches);
     only shown visually while the Y2K skin is active */
  body:not(.skin-y2k) .y2k-chrome{display:none;}

  /* ============ Y2K 像素插画皮肤 ============ */
  body.skin-y2k{
    background:#ffffff;
    font-family:'Noto Serif SC', serif;
  }
  body.skin-y2k h1{
    font-family:'Noto Serif SC', serif; font-weight:300;
    background:none; -webkit-text-fill-color:initial; color:#191726;
    letter-spacing:0.04em; transform:scaleX(0.92); transform-origin:left;
  }
  body.skin-y2k .eyebrow{background:#F1F1EF; color:#5A5A57;}
  body.skin-y2k nav#toc a{transition:color .18s ease,font-weight .18s ease;color:#5A5A57;}
  body.skin-y2k .toc-toggle{background:#F1F1EF; color:#5A5A57;}
  body.skin-y2k .toc-toggle:hover{background:#111; color:#fff;}
  body.skin-y2k .card, body.skin-y2k .col, body.skin-y2k .card-head{
    background:transparent; border:none; box-shadow:none; border-radius:0;
  }
  body.skin-y2k .card-body{
    padding:0; margin-top:12px; display:flex; flex-direction:column; gap:14px;
  }
  body.skin-y2k .card-shell{
    background:#fff; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.07);
    overflow:hidden; position:relative;
  }
  body.skin-y2k .card-head.card-shell{margin-bottom:0;}
  body.skin-y2k .col.card-shell{padding:0 12px 10px;}
  body.skin-y2k .list-shell-body, body.skin-y2k .table-shell-body{padding:0 16px 12px;}
  body.skin-y2k .y2k-chrome{
    display:flex; align-items:center; gap:5px; padding:6px 10px 6px 12px;
    border-bottom:1px solid #F0F0EE; position:relative; z-index:1;
  }
  body.skin-y2k .col.card-shell .y2k-chrome{margin:0 -12px 8px;}
  body.skin-y2k .y2k-chrome .dot{width:7px; height:7px; border-radius:50%;}
  body.skin-y2k .y2k-chrome .dot-r{background:#ED6A5E;}
  body.skin-y2k .y2k-chrome .dot-y{background:#F4BF4F;}
  body.skin-y2k .y2k-chrome .dot-g{background:#61C454;}
  body.skin-y2k .y2k-chrome-label{font-family:'JetBrains Mono',monospace; font-size:8.5px; color:#999; margin-left:4px;}
  body.skin-y2k .num-badge{display:none;}
  body.skin-y2k .card-title{
    font-family:'Noto Serif SC',serif; font-weight:400; font-size:1.0625rem; color:#161616;
    letter-spacing:0.04em; transform:scaleX(0.92); transform-origin:left;
  }
  body.skin-y2k .col-title{
    font-family:'Noto Serif SC',serif; font-weight:400; color:#161616;
    letter-spacing:0.04em; transform:scaleX(0.92); transform-origin:left; display:inline-block;
  }
  body.skin-y2k .col-title .kw-underline{
    text-decoration:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='6' viewBox='0 0 16 6'><path d='M0 4 Q4 0.5 8 4 T16 4' fill='none' stroke='%23F0B9D5' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat:repeat-x;
    background-position:0 100%;
    background-size:14px 6px;
    padding-bottom:2px;
  }
  body.skin-y2k .detail-text, body.skin-y2k table.kv{font-family:'Noto Serif SC',serif;}
  body.skin-y2k .row:hover{background:rgba(0,0,0,0.035);}
  body.skin-y2k .term-badge.y2k-tag{
    position:relative; z-index:0; background:#fff; padding:4px 9px; border-radius:6px;
    font-family:'Noto Serif SC',serif; font-weight:500; overflow:hidden;
  }
  body.skin-y2k .term-badge.y2k-tag::before{
    content:''; position:absolute; inset:0; z-index:-1; border-radius:inherit;
  }
  body.skin-y2k .note-box{background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.05); border-style:dashed;}
  body.skin-y2k .toolbar button{border-radius:20px; box-shadow:none;}
  body.skin-y2k .btn-primary{background:#111; color:#fff; box-shadow:none;}
  body.skin-y2k .btn-primary:hover{background:#000;}
  body.skin-y2k .btn-ghost{color:#161616;}
  body.skin-y2k .btn-ghost:hover{color:var(--seal); background:var(--seal-tint);}
  body.skin-y2k .btn-ghost.active{background:var(--seal); color:#fff;}
  body.skin-y2k .btn-seal{color:#161616;}
  body.skin-y2k .btn-seal:hover{background:var(--seal-tint); color:var(--seal);}
  body.skin-y2k .skin-switch button.active, body.skin-y2k .font-size-control button.active{background:var(--seal); color:#fff;}
  body.skin-y2k .skin-switch button:hover, body.skin-y2k .font-size-control button:hover{background:var(--seal-tint); color:var(--seal);}
  body.skin-y2k .mark-toggle.active{background:var(--seal); color:#fff;}
  body.skin-y2k .style-btn.active{background:var(--seal);}
  body.skin-y2k table.kv th{background:#FAFAF9;}
  body.skin-y2k nav#toc{padding:0; border:none; box-shadow:0 6px 18px rgba(0,0,0,.07); background:#fff;}
  body.skin-y2k nav#toc .toc-top{padding:10px 10px 8px;}
  body.skin-y2k nav#toc #tocList{padding:0 10px 10px;}
  body.skin-y2k .shell.toc-collapsed nav#toc{padding:0;}
  body.skin-y2k .shell.toc-collapsed nav#toc .toc-top{padding:8px 6px;}
  body.skin-y2k .shell.toc-collapsed nav#toc #tocList{padding:0 6px 8px;}

  body.skin-y2k .card[data-accent="pink"] .term-badge.y2k-tag{color:#111111; --nf:url(#n-pink);}
  body.skin-y2k .card[data-accent="pink"] .term-badge.y2k-tag::before{filter:var(--nf,url(#n-pink));}
</style>
</head>

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

const MARK_STYLE_PROPS = ['background', 'backgroundColor'];
const UL_STYLE_PROPS = ['textDecorationLine', 'textDecorationStyle', 'textDecorationColor', 'textDecorationThickness', 'textUnderlineOffset'];

function sanitizeInlineHTML(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  (function clean(node){
    Array.from(node.childNodes).forEach(child => {
      if(child.nodeType === 1){
        if(child.tagName === 'MARK' && child.classList.contains('hl')){
          const kept = {};
          MARK_STYLE_PROPS.forEach(p => { if(child.style[p]) kept[p] = child.style[p]; });
          Array.from(child.attributes).forEach(attr => child.removeAttribute(attr.name));
          child.className = 'hl';
          Object.keys(kept).forEach(p => { child.style[p] = kept[p]; });
          clean(child);
        }else if(child.tagName === 'SPAN' && child.classList.contains('ul')){
          const kept = {};
          UL_STYLE_PROPS.forEach(p => { if(child.style[p]) kept[p] = child.style[p]; });
          Array.from(child.attributes).forEach(attr => child.removeAttribute(attr.name));
          child.className = 'ul';
          Object.keys(kept).forEach(p => { child.style[p] = kept[p]; });
          clean(child);
        }else{
          const text = document.createTextNode(child.textContent);
          child.replaceWith(text);
        }
      }
    });
  })(tmp);
  return tmp.innerHTML;
}

function toSafeHTML(str){
  // Saved content (from a previous edit) already comes back to us as HTML source —
  // entities like "&amp;" for a literal "&", or a "&nbsp;" the browser inserted for
  // a typed space — not just when it also happens to contain <mark>/<span class="ul">.
  // Escaping it again here would double-encode it (e.g. "&amp;" -> "&amp;amp;"),
  // which then renders as literal "&amp;" text instead of "&". Anything that already
  // looks like HTML (a tag, or an entity) must be passed through as-is instead.
  if(str && /<[a-z][\s\S]*>|&(amp|lt|gt|quot|#39|nbsp|#\d+);/i.test(str)) return sanitizeInlineHTML(str);
  return escapeHTML(str);
}

function colTitleHTML(rawTitle){
  const title = rawTitle || '';
  if(!title) return '';
  if(currentSkin !== 'y2k' || /<mark class="hl"|<span class="ul"/.test(title)){
    return toSafeHTML(title);
  }
  const m = /^([\"“'‘])([^\"”'’]+)([\"”'’])([\s\S]*)$/.exec(title);
  if(m){
    const [, openQ, kw, closeQ, rest] = m;
    return escapeHTML(openQ) + '<span class="kw-underline">' + escapeHTML(kw) + '</span>' + escapeHTML(closeQ) + escapeHTML(rest);
  }
  return '<span class="kw-underline">' + escapeHTML(title) + '</span>';
}

  card.appendChild(body);
  head.querySelector('.card-title').addEventListener('input', () => {
    syncTocLabel(id, head.querySelector('.card-title').textContent);
    scheduleSave();
  });
  wireChromeLabelSync(
    head.querySelector('.y2k-chrome-label'),
    head.querySelector('.card-title'),
    t => 'localhost · ' + shortenTitle(t)
  );
  return {card, body, accent};
}

function buildSuppBlock(suppText){
  const wrap = document.createElement('div');
  wrap.className = 'supp-wrap';
  wrap.innerHTML = `
    <button type="button" class="supp-toggle" onclick="toggleSupp(this)" title="补充知识点" aria-label="补充知识点">
      <span class="plus-icon" aria-hidden="true">+</span>
    </button>
    <div class="supp-body" hidden>
      <div class="supp-text" contenteditable="true" data-placeholder="在这里补充你自己的知识点、例题或易错点…"></div>
    </div>
  `;
  const textEl = wrap.querySelector('.supp-text');
  textEl.innerHTML = toSafeHTML(suppText || '');
  textEl.addEventListener('input', scheduleSave);
  return wrap;
}

function toggleSupp(btn){
  const wrap = btn.closest('.supp-wrap');
  const body = wrap.querySelector('.supp-body');
  const willOpen = body.hidden;
  body.hidden = !willOpen;
  wrap.classList.toggle('open', willOpen);
}

// Populates an (already-attached) .card-body with the single-column list layout.
// Shared by buildListSection (new card) and convertCardLayout (existing card).
function populateListBody(body, items, title, shellChromeLabel, accent){
  const wrap = document.createElement('div');
  wrap.className = 'item-list';
  (items || []).forEach(it => wrap.appendChild(buildRow(it.term, it.detail, false, accent)));
  const addBtn = buildAddRowBtn(() => {
    const row = buildRow('标签', '', false, accent);
    wrap.appendChild(row);
    row.querySelector('.detail-text').focus();
    commitChange();
  });
  const shell = document.createElement('div');
  shell.className = 'card-shell list-shell';
  shell.appendChild(chromeBarEl(shellChromeLabel || shortenTitle(title)));
  const inner = document.createElement('div');
  inner.className = 'list-shell-body';
  inner.appendChild(wrap);
  inner.appendChild(addBtn);
  shell.appendChild(inner);
  body.appendChild(shell);
}

function buildListSection(data){
  const id = nextId();
  const {card, body, accent} = buildCardShell(id, data.title, data.chromeLabel);
  card.dataset.type = 'list';
  populateListBody(body, data.items, data.title, data.shellChromeLabel, accent);
  card.appendChild(buildSuppBlock(data.supp));
  return {id, title:data.title, el:card};
}

function buildTableSection(data){
  const id = nextId();
  const {card, body, accent} = buildCardShell(id, data.title, data.chromeLabel);
  card.dataset.type = 'table';
  const table = document.createElement('table');
  table.className = 'kv';
  const thead = document.createElement('tr');
  (data.headers||[]).forEach(h => { const th = document.createElement('th'); th.textContent = h; thead.appendChild(th); });
  thead.appendChild(document.createElement('th'));
  table.appendChild(thead);
  (data.rows||[]).forEach(r => table.appendChild(buildTableRow(r)));
  const addBtn = buildAddRowBtn(() => {
    const tr = buildTableRow(['','']);
    table.appendChild(tr);
    tr.querySelector('td').focus();
    commitChange();
  });
  const shell = document.createElement('div');
  shell.className = 'card-shell table-shell';
  shell.appendChild(chromeBarEl(data.shellChromeLabel || shortenTitle(data.title)));
  const inner = document.createElement('div');
  inner.className = 'table-shell-body';
  inner.appendChild(table);
  inner.appendChild(addBtn);
  shell.appendChild(inner);
  body.appendChild(shell);
  card.appendChild(buildSuppBlock(data.supp));
  return {id, title:data.title, el:card};
}

function buildTableRow(cells){
  const tr = document.createElement('tr');
  cells.forEach(c => {
    const td = document.createElement('td');
    td.contentEditable = 'true';
    td.innerHTML = toSafeHTML(c);
    if(/不能|不可|★/.test(td.textContent)) td.classList.add('danger');
    td.addEventListener('input', () => {
      td.classList.toggle('danger', /不能|不可|★/.test(td.textContent));
      scheduleSave();
    });
    tr.appendChild(td);
  });
  const delTd = document.createElement('td');
  delTd.className = 'row-del';
  delTd.innerHTML = `<button class="icon-btn editing-only" title="删除该行" onclick="removeTableRow(this)"><svg class="svgi svgi-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>`;
  tr.appendChild(delTd);
  return tr;
}

// Populates an (already-attached) .card-body with the two-column compare layout.
// Shared by buildCompareSection (new card) and convertCardLayout (existing card).
function populateCompareBody(body, cols, note, accent){
  const grid = document.createElement('div');
  grid.className = 'compare-grid';
  (cols || []).forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'col col-' + col.color + ' card-shell';
    colEl.dataset.color = col.color;
    colEl.appendChild(chromeBarEl(col.chromeLabel || shortenTitle(col.title)));
    const colHead = document.createElement('div');
    colHead.className = 'col-head';
    colHead.innerHTML = `<span class="drag-handle" data-drag-role="col" title="拖动调整卡片顺序" aria-hidden="true">${HANDLE_SVG}</span><span class="col-title" contenteditable="true">${colTitleHTML(col.title)}</span>`;
    colEl.appendChild(colHead);
    wireChromeLabelSync(
      colEl.querySelector('.y2k-chrome-label'),
      colHead.querySelector('.col-title'),
      t => shortenTitle(t)
    );
    const wrap = document.createElement('div');
    wrap.className = 'item-list';
    (col.items||[]).forEach(it => wrap.appendChild(buildRow(it.term, it.detail, true, accent)));
    colEl.appendChild(wrap);
    colEl.appendChild(buildAddRowBtn(() => {
      const row = buildRow('标签', '', true, accent);
      wrap.appendChild(row);
      row.querySelector('.detail-text').focus();
      commitChange();
    }));
    colEl.appendChild(buildSuppBlock(col.supp));
    grid.appendChild(colEl);
  });
  body.appendChild(grid);
  if(note){
    const noteEl = document.createElement('div');
    noteEl.className = 'note-box';
    noteEl.innerHTML = `<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.6c.6.5 1 1.3 1 2.1v.3h6v-.3c0-.8.4-1.6 1-2.1A7 7 0 0012 2z"/></svg><span class="detail-text" contenteditable="true">${toSafeHTML(note)}</span>`;
    body.appendChild(noteEl);
  }
}

function buildCompareSection(data){
  const id = nextId();
  const {card, body, accent} = buildCardShell(id, data.title, data.chromeLabel);
  card.dataset.type = 'compare';
  populateCompareBody(body, data.cols, data.note, accent);
  return {id, title:data.title, el:card};
}

function renderSection(data){
  let result;
  if(data.type === 'compare') result = buildCompareSection(data);
  else if(data.type === 'table') result = buildTableSection(data);
  else result = buildListSection(data);
  container.appendChild(result.el);
  addTocEntry(result.id, result.title, result.el.dataset.accent);
  return result;
}

function addTocEntry(id, title, accent){
  const a = document.createElement('a');
  a.href = '#' + id;
  a.dataset.for = id;
  a.dataset.accent = accent || '';
  a.innerHTML = `<span class="num">${String(tocEl.querySelectorAll('a').length + 1).padStart(2,'0')}</span><span class="label">${escapeHTML(title)}</span><span class="toc-fly" aria-hidden="true">${HANDLE_SVG}</span>`;
  document.getElementById('tocList').appendChild(a);
}

function syncTocLabel(id, text){
  const a = tocEl.querySelector(`a[data-for="${id}"]`);
  if(a) a.querySelector('.label').textContent = text;
}

const CN_DIGITS = ['零','一','二','三','四','五','六','七','八','九'];
function toChineseNumeral(n){
  if(n <= 0) return '';
  if(n < 10) return CN_DIGITS[n];
  if(n < 20) return '十' + (n % 10 === 0 ? '' : CN_DIGITS[n % 10]);
  if(n < 100){
    const tens = Math.floor(n / 10);
    const ones = n % 10;
    return (tens === 1 ? '' : CN_DIGITS[tens]) + '十' + (ones === 0 ? '' : CN_DIGITS[ones]);
  }
  return String(n);
}

const CN_NUMERAL_PREFIX = /^([〇零一二三四五六七八九十百]+)(、)/;

function renumberCardTitles(){
  const cards = container.querySelectorAll(':scope > .card');
  cards.forEach((card, i) => {
    const titleEl = card.querySelector('.card-title');
    if(!titleEl) return;
    const firstNode = titleEl.firstChild;
    if(!firstNode || firstNode.nodeType !== 3) return;
    const m = CN_NUMERAL_PREFIX.exec(firstNode.data);
    if(!m) return;
    const newNumeral = toChineseNumeral(i + 1);
    if(newNumeral === m[1]) return;
    firstNode.data = newNumeral + m[2] + firstNode.data.slice(m[0].length);
    syncTocLabel(card.id, titleEl.textContent);
  });
}

function renumber(){
  const cards = container.querySelectorAll('.card');
  cards.forEach((c, i) => {
    const badge = c.querySelector('.num-badge');
    if(badge) badge.textContent = i + 1;
  });
  const links = tocEl.querySelectorAll('a .num');
  links.forEach((n, i) => n.textContent = String(i+1).padStart(2,'0'));
  renumberCardTitles();
}

// Content (titles, items, chrome labels...) is always editable now — isEditing /
// .edit-mode only gates deletion (delete a section/row), as a guard against
// accidental taps. There's no more content-editable sweep to run here, since every
// editable element is created with contenteditable="true" already.
function setEditMode(enabled){
  isEditing = enabled;
  document.body.classList.toggle('edit-mode', isEditing);
  if(editToggleBtn){
    editToggleBtn.innerHTML = isEditing
      ? '<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>'
      : '<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
    const editLabel = isEditing ? '锁定删除' : '解锁删除';
    editToggleBtn.title = editLabel;
    editToggleBtn.setAttribute('aria-label', editLabel);
  }
  if(saveStatus){
    saveStatus.textContent = isEditing
      ? '删除已解锁：可以删除板块和条目了；其余编辑随时都能改，会自动保存。'
      : '删除已锁定：点击“解锁删除”后才能删除板块/条目；其余编辑随时都能改。';
  }
}

function toggleEditMode(){
  setEditMode(!isEditing);
  saveNow();
}

function requireEditMode(){
  if(isEditing) return true;
  if(saveStatus) saveStatus.textContent = '删除功能还没解锁，请先点击“解锁删除”。';
  return false;
}

function removeRow(btn){
  if(!requireEditMode()) return;
  btn.closest('.row').remove();
  commitChange();
}

function removeTableRow(btn){
  if(!requireEditMode()) return;
  btn.closest('tr').remove();
  commitChange();
}

function deleteCard(id){
  if(!requireEditMode()) return;
  if(!confirm('确定删除这个板块吗？')) return;
  const card = document.getElementById(id);
  if(card) card.remove();
  const link = tocEl.querySelector(`a[data-for="${id}"]`);
  if(link) link.remove();
  renumber();
  commitChange();
}

function toggleLayoutPopover(btn){
  const pop = btn.nextElementSibling;
  const wasOpen = pop.classList.contains('open');
  closeMarkPopovers();
  pop.classList.toggle('open', !wasOpen);
}

// Rebuilds a card's body in place (same id, same title, same position — the TOC
// entry stays valid) as either a single list or a two-column compare, carrying
// existing items over. Table-type cards aren't offered this control at all, since
// their row/column shape doesn't map onto term+detail items.
function convertCardLayout(id, targetLayout){
  closeMarkPopovers();
  const card = document.getElementById(id);
  if(!card) return;
  const currentType = card.dataset.type;
  if(currentType !== 'list' && currentType !== 'compare') return;

  const accent = card.dataset.accent;
  const oldBody = card.querySelector(':scope > .card-body');
  const title = card.querySelector('.card-title').textContent;

  let leftItems, rightItems, leftTitle = '', rightTitle = '', note = '';
  if(currentType === 'list'){
    leftItems = serializeRows(oldBody.querySelector('.item-list'));
    rightItems = [];
  }else{
    const cols = Array.from(oldBody.querySelectorAll(':scope > .compare-grid > .col'));
    leftItems = serializeRows(cols[0]?.querySelector('.item-list'));
    rightItems = serializeRows(cols[1]?.querySelector('.item-list'));
    leftTitle = sanitizeInlineHTML(cols[0]?.querySelector('.col-title')?.innerHTML || '').trim();
    rightTitle = sanitizeInlineHTML(cols[1]?.querySelector('.col-title')?.innerHTML || '').trim();
    note = sanitizeInlineHTML(oldBody.querySelector(':scope > .note-box .detail-text')?.innerHTML || '').trim();
  }

  const newBody = document.createElement('div');
  newBody.className = 'card-body';

  if(targetLayout === 'list'){
    populateListBody(newBody, leftItems.concat(rightItems), title, '', accent);
    card.dataset.type = 'list';
  }else{
    const withSubtitle = targetLayout === 'compare';
    populateCompareBody(newBody, [
      {color:'teal', title: withSubtitle ? (leftTitle || '小标题') : '', items:leftItems},
      {color:'coral', title: withSubtitle ? (rightTitle || '小标题') : '', items:rightItems}
    ], note, accent);
    card.dataset.type = 'compare';
  }

  oldBody.replaceWith(newBody);
  commitChange();
}

function addSection(layout){
  let data;
  if(layout === 'compare' || layout === 'compare-plain'){
    const colTitle = layout === 'compare' ? '小标题' : '';
    data = { type:'compare', title:'新板块', cols:[
      {color:'teal', title:colTitle, items:[{term:'标签', detail:''}]},
      {color:'coral', title:colTitle, items:[{term:'标签', detail:''}]}
    ]};
  }else{
    data = { type:'list', title:'新板块', items:[{term:'标签', detail:''}] };
  }
  const result = renderSection(data);
  renumber();
  result.el.scrollIntoView({behavior:'smooth', block:'center'});
  result.el.querySelector('.card-title').focus();
  commitChange();
}

function renderAll(data){
  container.innerHTML = '';
  tocEl.querySelectorAll('a').forEach(a => a.remove());
  uid = 0;
  data.forEach(renderSection);
  renumber();
  setEditMode(isEditing);
  setupTocScrollSpy();
}

/* TOC 滚动同步高亮 — 阅读锚点：35% 视口基准线 + 节流 */
function setupTocScrollSpy(){
  const cards=container.querySelectorAll('.card[id]');
  if(!cards.length) return;
  if(window._tocScrollCleanup){ window._tocScrollCleanup(); window._tocScrollCleanup=null; window._tocScrollTicking=false; }
  function updateActive(){
    const vh=window.innerHeight, anchorY=vh*0.35;
    let bestCard=null, bestDist=Infinity;
    cards.forEach(card=>{
      const top=card.getBoundingClientRect().top;
      if(top<=anchorY){ const dist=anchorY-top; if(dist<bestDist){ bestDist=dist; bestCard=card; } }
    });
    if(!bestCard&&cards.length){
      let first=cards[0], firstDist=Infinity;
      cards.forEach(card=>{ const d=card.getBoundingClientRect().top; if(d<firstDist){ firstDist=d; first=card; } });
      bestCard=first;
    }
    const cardId=bestCard?bestCard.id:null;
    tocEl.querySelectorAll('a').forEach(a=>{ a.classList.toggle('active',cardId&&a.dataset.for===cardId); });
  }
  let ticking=false;
  function onScroll(){ if(!ticking){ requestAnimationFrame(()=>{ updateActive(); ticking=false; }); ticking=true; } }
  window.addEventListener('scroll',onScroll,{passive:true});
  window._tocScrollCleanup=()=>{ window.removeEventListener('scroll',onScroll); window._tocScrollTicking=false; };
  window._tocScrollTicking=true;
  updateActive();
}

function serializeRows(scope){
  return Array.from(scope.querySelectorAll(':scope > .row')).map(row => ({
    term: sanitizeInlineHTML(row.querySelector('.term-badge')?.innerHTML || '').trim(),
    detail: sanitizeInlineHTML(row.querySelector('.detail-text')?.innerHTML || '').trim()
  }));
}

function serializeSections(){
  return Array.from(container.querySelectorAll(':scope > .card')).map(card => {
    const title = sanitizeInlineHTML(card.querySelector('.card-title')?.innerHTML || '').trim() || '未命名板块';
    const type = card.dataset.type || 'list';
    const body = card.querySelector('.card-body');
    const bannerLabelEl = card.querySelector(':scope > .card-head .y2k-chrome-label');
    const chromeLabel = bannerLabelEl ? sanitizeInlineHTML(bannerLabelEl.innerHTML || '').trim() : '';

    if(type === 'table'){
      const headerCells = Array.from(body.querySelectorAll('table.kv tr:first-child th'));
      const headers = headerCells.slice(0, -1).map(th => th.textContent.trim());
      const rows = Array.from(body.querySelectorAll('table.kv tr')).slice(1).map(tr =>
        Array.from(tr.querySelectorAll('td')).slice(0, -1).map(td => sanitizeInlineHTML(td.innerHTML).trim())
      );
      const supp = sanitizeInlineHTML(card.querySelector(':scope > .supp-wrap .supp-text')?.innerHTML || '').trim();
      const shellLabelEl = body.querySelector('.table-shell .y2k-chrome-label');
      const shellChromeLabel = shellLabelEl ? sanitizeInlineHTML(shellLabelEl.innerHTML || '').trim() : '';
      return {type, title, headers, rows, ...(supp ? {supp} : {}), ...(chromeLabel ? {chromeLabel} : {}), ...(shellChromeLabel ? {shellChromeLabel} : {})};
    }

    if(type === 'compare'){
      const cols = Array.from(body.querySelectorAll('.compare-grid > .col')).map(col => {
        const colSupp = sanitizeInlineHTML(col.querySelector('.supp-text')?.innerHTML || '').trim();
        const colLabelEl = col.querySelector('.y2k-chrome-label');
        const colChromeLabel = colLabelEl ? sanitizeInlineHTML(colLabelEl.innerHTML || '').trim() : '';
        return {
          color: col.dataset.color || Array.from(col.classList).find(c => c.startsWith('col-'))?.replace('col-', '') || 'teal',
          title: sanitizeInlineHTML(col.querySelector('.col-title')?.innerHTML || '').trim(),
          items: serializeRows(col.querySelector('.item-list') || col),
          ...(colSupp ? {supp: colSupp} : {}),
          ...(colChromeLabel ? {chromeLabel: colChromeLabel} : {})
        };
      });
      const note = sanitizeInlineHTML(body.querySelector('.note-box .detail-text')?.innerHTML || '').trim();
      return {type, title, cols, ...(note ? {note} : {}), ...(chromeLabel ? {chromeLabel} : {})};
    }

    const supp = sanitizeInlineHTML(card.querySelector(':scope > .supp-wrap .supp-text')?.innerHTML || '').trim();
    const shellLabelEl = body.querySelector('.list-shell .y2k-chrome-label');
    const shellChromeLabel = shellLabelEl ? sanitizeInlineHTML(shellLabelEl.innerHTML || '').trim() : '';
    return {
      type,
      title,
      items: serializeRows(body.querySelector('.item-list') || body),
      ...(supp ? {supp} : {}),
      ...(chromeLabel ? {chromeLabel} : {}),
      ...(shellChromeLabel ? {shellChromeLabel} : {})
    };
  });
}

function saveNow(){
  try{
    const currentData = serializeSections();
    localStorage.setItem(storageKey, JSON.stringify(currentData));
    pushHistory(currentData);
    if(!isRestoring){
      redoStack = [];
      try{ localStorage.setItem(redoKey, JSON.stringify(redoStack)); }catch(err){}
    }
    if(saveStatus) saveStatus.textContent = '已自动保存：' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }catch(err){
    if(saveStatus) saveStatus.textContent = '自动保存失败：浏览器可能禁用了本地存储，请先导出当前版本。';
  }
}

function scheduleSave(){
  if(isRestoring) return;
  if(saveStatus) saveStatus.textContent = '正在保存...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 250);
}

// For discrete one-shot edits (add/delete a row or section, apply/remove a
// highlight, drag-reorder, switch a card's layout) — unlike continuous typing,
// there's no "field" to wait for the user to leave, so each one commits its own
// undo step right away instead of possibly merging with whatever else happens to
// land in the same debounce window.
function commitChange(){
  clearTimeout(saveTimer);
  saveNow();
}

function pushHistory(data){
  if(isRestoring) return;
  const snapshot = JSON.stringify(data || serializeSections());
  if(historyStack[historyStack.length - 1] === snapshot) return;
  historyStack.push(snapshot);
  if(historyStack.length > maxHistory) historyStack.shift();
  try{
    localStorage.setItem(historyKey, JSON.stringify(historyStack));
  }catch(err){}
}

function loadHistory(){
  try{
    const savedHistory = JSON.parse(localStorage.getItem(historyKey) || '[]');
    if(Array.isArray(savedHistory)) historyStack = savedHistory.filter(item => typeof item === 'string').slice(-maxHistory);
  }catch(err){
    historyStack = [];
  }
  try{
    const savedRedo = JSON.parse(localStorage.getItem(redoKey) || '[]');
    if(Array.isArray(savedRedo)) redoStack = savedRedo.filter(item => typeof item === 'string').slice(-maxHistory);
  }catch(err){
    redoStack = [];
  }
}

function undoLastChange(){
  clearTimeout(saveTimer);
  pushHistory(serializeSections());
  if(historyStack.length < 2){
    if(saveStatus) saveStatus.textContent = '暂时没有可撤销的上一步。';
    return;
  }
  const poppedCurrent = historyStack.pop();
  redoStack.push(poppedCurrent);
  if(redoStack.length > maxHistory) redoStack.shift();
  const previous = JSON.parse(historyStack[historyStack.length - 1]);
  isRestoring = true;
  renderAll(previous);
  localStorage.setItem(storageKey, JSON.stringify(previous));
  localStorage.setItem(historyKey, JSON.stringify(historyStack));
  try{ localStorage.setItem(redoKey, JSON.stringify(redoStack)); }catch(err){}
  isRestoring = false;
  if(saveStatus) saveStatus.textContent = '已撤销到上一步。';
}

function redoLastChange(){
  if(!redoStack.length){
    if(saveStatus) saveStatus.textContent = '暂时没有可前进的下一步。';
    return;
  }
  clearTimeout(saveTimer);
  const next = redoStack.pop();
  historyStack.push(next);
  if(historyStack.length > maxHistory) historyStack.shift();
  const data = JSON.parse(next);
  isRestoring = true;
  renderAll(data);
  localStorage.setItem(storageKey, JSON.stringify(data));
  localStorage.setItem(historyKey, JSON.stringify(historyStack));
  try{ localStorage.setItem(redoKey, JSON.stringify(redoStack)); }catch(err){}
  isRestoring = false;
  if(saveStatus) saveStatus.textContent = '已前进到下一步。';
}

// One-off repair for content that was already double-escaped by the toSafeHTML bug
// before it was fixed (e.g. "A &amp; B" saved, then re-escaped on render into
// "A &amp;amp; B", which displays as literal "A &amp; B"). Collapses any entity
// that's itself escaping another entity, however many times that happened.
function collapseDoubleEscapedEntities(str){
  if(typeof str !== 'string' || str.indexOf('&amp;') === -1) return str;
  let prev;
  do{
    prev = str;
    str = str.replace(/&amp;(amp|lt|gt|quot|#39|nbsp|#\d+);/g, '&$1;');
  }while(str !== prev);
  return str;
}
function repairDoubleEscapedData(value){
  if(typeof value === 'string') return collapseDoubleEscapedEntities(value);
  if(Array.isArray(value)) return value.map(repairDoubleEscapedData);
  if(value && typeof value === 'object'){
    const out = {};
    Object.keys(value).forEach(k => { out[k] = repairDoubleEscapedData(value[k]); });
    return out;
  }
  return value;
}

function getInitialData(){
  try{
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if(Array.isArray(saved) && saved.length) return repairDoubleEscapedData(saved);
  }catch(err){}
  return seedData;
}

function resetSavedData(){
  if(!confirm('确定恢复为初始版本吗？当前浏览器里自动保存的修改会被清空。')) return;
  localStorage.removeItem(storageKey);
  redoStack = [];
  try{ localStorage.setItem(redoKey, JSON.stringify(redoStack)); }catch(err){}
  renderAll(seedData);
  saveNow();
}

// 'blur' doesn't bubble, so listen on the capture phase to catch it delegated —
// this is what gives per-field undo granularity: typing itself only debounce-saves
// (see the 'input' listener above), but leaving a field commits that field's edit
// as its own undo step, instead of it only settling whenever the shared 250ms
// autosave timer next happens to fire (which could bundle in edits made elsewhere
// in the meantime).
container.addEventListener('blur', event => {
  if(!event.target.isContentEditable) return;
  commitChange();
}, true);

const noiseFlowSeeds = ['url(#n-pink)','url(#n-pink-b)','url(#n-pink-c)','url(#n-pink-d)'];
const noiseFlowActive = new WeakSet();
function startNoiseFlow(badge){
  if(!badge || currentSkin !== 'y2k' || noiseFlowActive.has(badge)) return;
  noiseFlowActive.add(badge);
  let i = 0;
  const totalSteps = 8;
  const timer = setInterval(() => {
    i++;
    if(i > totalSteps){
      clearInterval(timer);
      badge.style.removeProperty('--nf');
      noiseFlowActive.delete(badge);
      return;
    }
    badge.style.setProperty('--nf', noiseFlowSeeds[i % noiseFlowSeeds.length]);
  }, 175);
}

let highlightMode = false;
let underlineMode = false;
let eraserMode = false;
const HIGHLIGHT_COLORS = ['#CFE9E2', '#FCD4D8', '#F3EADA', '#EDDAC9'];
const UNDERLINE_COLORS = ['#CFE9E2', '#FCD4D8', '#F3EADA', '#EDDAC9'];
let currentHighlightColor = HIGHLIGHT_COLORS[0];
let currentUnderlineColor = UNDERLINE_COLORS[0];
let currentUnderlineStyle = 'solid';

function buildSwatches(containerEl, colors, current, onPick){
  containerEl.innerHTML = '';
  colors.forEach(color => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch' + (color === current ? ' selected' : '');
    btn.style.background = color;
    btn.onclick = () => onPick(color);
    containerEl.appendChild(btn);
  });
}

function refreshMarkUI(){
  const hDot = document.getElementById('highlightColorDot');
  if(hDot) hDot.style.background = currentHighlightColor;
  const uDot = document.getElementById('underlineColorDot');
  if(uDot) uDot.style.background = currentUnderlineColor;
  const hBtn = document.getElementById('highlightToggleBtn');
  if(hBtn) hBtn.classList.toggle('active', highlightMode);
  const uBtn = document.getElementById('underlineToggleBtn');
  if(uBtn) uBtn.classList.toggle('active', underlineMode);
  const eBtn = document.getElementById('eraserToggleBtn');
  if(eBtn) eBtn.classList.toggle('active', eraserMode);
  buildSwatches(document.getElementById('highlightSwatches'), HIGHLIGHT_COLORS, currentHighlightColor, color => {
    currentHighlightColor = color;
    highlightMode = true;
    eraserMode = false;
    closeMarkPopovers();
    afterMarkModeChange();
  });
  buildSwatches(document.getElementById('underlineSwatches'), UNDERLINE_COLORS, currentUnderlineColor, color => {
    currentUnderlineColor = color;
    underlineMode = true;
    eraserMode = false;
    closeMarkPopovers();
    afterMarkModeChange();
  });
  const solidBtn = document.getElementById('underlineStyleSolid');
  const wavyBtn = document.getElementById('underlineStyleWavy');
  if(solidBtn) solidBtn.classList.toggle('active', currentUnderlineStyle === 'solid');
  if(wavyBtn) wavyBtn.classList.toggle('active', currentUnderlineStyle === 'wavy');
  document.body.classList.toggle('highlight-mode', highlightMode);
  document.body.classList.toggle('underline-mode', underlineMode);
  document.body.classList.toggle('eraser-mode', eraserMode);
}

function afterMarkModeChange(){
  refreshMarkUI();
  if(saveStatus){
    const parts = [];
    if(highlightMode) parts.push('高亮');
    if(underlineMode) parts.push('下划线');
    if(eraserMode) parts.push('橡皮擦');
    saveStatus.textContent = parts.length
      ? parts.join(' + ') + '模式已开启：' + (eraserMode ? '点击或框选已标记的文字即可清除标记。' : '选中文字即可标记，点击已标记的文字可取消。')
      : '标记模式已关闭。';
  }
}

function toggleMarkMode(tool){

  else underlineMode = !underlineMode;
  eraserMode = false;

}

function toggleEraserMode(){

  underlineMode = true;

});

function unwrapNode(node){
  const parent = node.parentNode;
  if(!parent) return;
  while(node.firstChild) parent.insertBefore(node.firstChild, node);
  parent.removeChild(node);
  parent.normalize();
}

function applyMarksToSelection(){
  if(!highlightMode && !underlineMode) return;
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const anchorNode = range.commonAncestorContainer;
  const anchorEl = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
  if(!anchorEl || !container.contains(anchorEl)) return;
  if(anchorEl.closest('th') || anchorEl.closest('button') || anchorEl.closest('nav#toc')) return;
  let frag;
  try{
    frag = range.extractContents();
  }catch(err){
    return;
  }
  let wrapper = frag;
  if(underlineMode){
    const ul = document.createElement('span');
    ul.className = 'ul';
    ul.style.textDecorationLine = 'underline';
    ul.style.textDecorationStyle = currentUnderlineStyle;
    ul.style.textDecorationColor = currentUnderlineColor;
    ul.style.textDecorationThickness = '2.5px';
    ul.style.textUnderlineOffset = '3px';
    ul.appendChild(wrapper);
    wrapper = ul;
  }
  if(highlightMode){
    const mark = document.createElement('mark');
    mark.className = 'hl';
    mark.style.background = currentHighlightColor;
    mark.appendChild(wrapper);
    wrapper = mark;
  }
  range.insertNode(wrapper);
  sel.removeAllRanges();
  commitChange();
}

function eraseMarksAt(startEl){
  let el = startEl.nodeType === 1 ? startEl : startEl.parentElement;
  el = el ? el.closest('mark.hl, span.ul') : null;
  let removed = false;
  while(el){
    const parent = el.parentElement;
    unwrapNode(el);
    removed = true;
    el = (parent && parent.matches && parent.matches('mark.hl, span.ul')) ? parent : null;
  }
  return removed;
}

function eraseSelection(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const anchorNode = range.commonAncestorContainer;
  const anchorEl = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
  if(!anchorEl || !container.contains(anchorEl)) return;
  if(anchorEl.closest('th') || anchorEl.closest('button') || anchorEl.closest('nav#toc')) return;
  const marks = container.querySelectorAll('mark.hl, span.ul');
  let removed = false;
  marks.forEach(node => {
    if(container.contains(node) && range.intersectsNode(node)){
      unwrapNode(node);
      removed = true;
    }
  });
  sel.removeAllRanges();
  if(removed) commitChange();
}

container.addEventListener('mouseup', () => {
  setTimeout(() => {
    if(eraserMode){ eraseSelection(); return; }
    applyMarksToSelection();
  }, 0);
});

container.addEventListener('click', event => {
  if(eraserMode){
    if(eraseMarksAt(event.target)) commitChange();
    return;
  }
  if(highlightMode){
    const mark = event.target.closest('mark.hl');
    if(mark){ unwrapNode(mark); commitChange(); }
  }
  if(underlineMode){
    const ul = event.target.closest('span.ul');
    if(ul){ unwrapNode(ul); commitChange(); }
  }
});

/* ---- 三级拖拽排序（条目 / 小卡片 / 大板块），阅读与编辑模式下均可用 ---- */
let dragState = null;

function dragRoleMatch(el, role){
  if(role === 'section') return el.classList.contains('card');
  if(role === 'col') return el.classList.contains('col');
  return el.classList.contains('row');
}

function syncTocOrder(){
  const tocList = document.getElementById('tocList');
  Array.from(container.querySelectorAll(':scope > .card')).forEach(card => {
    const link = tocEl.querySelector(`a[data-for="${card.id}"]`);
    if(link) tocList.appendChild(link);
  });
}

function onDragMove(e){
  if(!dragState) return;
  const {item, list, role} = dragState;
  const axis = list.classList.contains('compare-grid') ? 'x' : 'y';
  const siblings = Array.from(list.children).filter(el => el !== item && dragRoleMatch(el, role));
  let after = null;
  for(const sib of siblings){
    const box = sib.getBoundingClientRect();
    const mid = axis === 'x' ? box.left + box.width / 2 : box.top + box.height / 2;
    const pos = axis === 'x' ? e.clientX : e.clientY;
    if(pos < mid){ after = sib; break; }
  }
  if(after) list.insertBefore(item, after);
  else list.appendChild(item);
}

function onDragEnd(){
  if(!dragState) return;
  const {item, role} = dragState;
  item.classList.remove('is-dragging');
  document.body.classList.remove('dragging-active');
  document.removeEventListener('pointermove', onDragMove);
  if(role === 'section'){ renumber(); syncTocOrder(); }
  dragState = null;
  commitChange();
}

function initSortable(){
  document.addEventListener('pointerdown', e => {
    if(e.button !== undefined && e.button !== 0) return;
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const role = handle.dataset.dragRole;
    let item = null;
    if(role === 'section') item = handle.closest('.card');
    else if(role === 'col') item = handle.closest('.col');
    else if(role === 'item') item = handle.closest('.row');
    if(!item) return;
    const list = item.parentElement;
    if(!list) return;
    e.preventDefault();
    dragState = { item, list, role };
    item.classList.add('is-dragging');
    document.body.classList.add('dragging-active');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd, { once:true });
  });
}

  document.body.classList.toggle('skin-y2k', skin === 'y2k');
  document.body.classList.toggle('skin-classic', skin === 'classic');
  document.querySelectorAll('#skinSwitch button').forEach(btn => {

/* ---- CD 光盘悬浮菜单：把次要按钮搬进/搬出光盘（大 CD 或吸顶后的迷你 CD） ---- */
function relocateCdPanel(skin){
  const panel = document.getElementById('cdPanel');
  const cdAnchor = document.getElementById('cdPanelAnchor');
  const cdAnchorMini = document.getElementById('cdPanelAnchorMini');
  const toolbarAnchor = document.getElementById('toolbarPanelAnchor');
  if(!panel || !cdAnchor || !toolbarAnchor) return;
  let isNarrow = false;
  try{ isNarrow = window.matchMedia('(max-width:860px)').matches; }catch(err){}
  if(skin === 'y2k' && !isNarrow && isToolbarPinned && cdAnchorMini){
    cdAnchorMini.after(panel);
    panel.classList.add('cd-panel--floating');
  }else if(skin === 'y2k' && !isNarrow){
    cdAnchor.after(panel);
    panel.classList.add('cd-panel--floating');
  }else{
    toolbarAnchor.after(panel);
    panel.classList.remove('cd-panel--floating');
  }
}

/* ---- 工具栏 + 目录吸顶：滚动到工具栏原始位置后，用 fixed 把它们钉住，页面继续用整页滚动条 ---- */
let isToolbarPinned = false;
let pinThresholdY = 0;

function applyPinned(pinned){
  const toolbar = document.getElementById('toolbarEl');
  const nav = document.getElementById('toc');
  const spacer = document.getElementById('toolbarSpacer');
  const shell = document.querySelector('.shell');
  if(!toolbar || !nav || !spacer || !shell) return;
  isToolbarPinned = pinned;
  if(pinned){
    // capture nav's current on-screen position BEFORE any layout changes below, so
    // that switching it to fixed keeps it exactly where it already was (no visual
    // jump). (toolbar.style.left can safely use the shell's own edge because the
    // toolbar cancels the shell's padding with a matching negative margin — nav has
    // no such trick, so it needs its own measured offset, both for top and left.)
    const navRectBeforePin = nav.getBoundingClientRect();
    // main isn't repositioned the way nav is, so it must stay exactly where it was
    // in the document flow. Removing the toolbar from flow (and collapsing it to a
    // hairline) shifts everything below it by more than just "the toolbar's own
    // height" — margins and grid row-gaps collapse too — so instead of guessing at
    // that amount, measure main's real position before/after and let the spacer
    // cancel out whatever actually moved.
    const main = document.querySelector('main');
    const mainDocTopBefore = main ? main.getBoundingClientRect().top + window.scrollY : 0;
    const rect = shell.getBoundingClientRect();
    toolbar.classList.add('pinned');
    toolbar.style.left = Math.round(rect.left) + 'px';
    toolbar.style.width = Math.round(rect.width) + 'px';
    spacer.style.height = '0px';
    if(main){
      const mainDocTopAfterRaw = main.getBoundingClientRect().top + window.scrollY;
      spacer.style.height = Math.max(0, Math.round(mainDocTopBefore - mainDocTopAfterRaw)) + 'px';
    }
    // measure AFTER switching to fixed + setting width, since content (cd-dock) only
    // becomes visible once .pinned is applied and can wrap differently at a new width
    const toolbarHeight = (toolbar.offsetHeight || 70) + 6;
    nav.classList.add('pinned');
    const collapsed = shell.classList.contains('toc-collapsed');
    nav.style.left = Math.round(navRectBeforePin.left) + 'px';
    nav.style.width = (collapsed ? 56 : 270) + 'px';
    // land at nav's own just-before-pin position first (no jump), then — since the
    // toolbar is now just a hairline — settle it up against that hairline right
    // after, animated via the CSS transition on nav#toc.pinned. Landing straight on
    // toolbarHeight instead would snap the gap shut instantly, which is the same
    // kind of jarring jump this was meant to avoid in the first place.
    nav.style.top = Math.max(toolbarHeight, Math.round(navRectBeforePin.top)) + 'px';
    requestAnimationFrame(() => {
      if(isToolbarPinned) nav.style.top = toolbarHeight + 'px';
    });
  }else{
    spacer.style.height = '0';
    toolbar.classList.remove('pinned');
    toolbar.style.left = '';
    toolbar.style.width = '';
    nav.classList.remove('pinned');
    nav.style.left = '';
    nav.style.width = '';
    nav.style.top = '';
  }
  document.body.classList.toggle('pinned', pinned);
  relocateCdPanel(currentSkin);
}

function measurePinThreshold(){
  const toolbar = document.getElementById('toolbarEl');
  if(!toolbar) return;
  const wasPinned = isToolbarPinned;
  if(wasPinned) applyPinned(false);
  const rect = toolbar.getBoundingClientRect();
  pinThresholdY = rect.top + window.scrollY;
  if(wasPinned) applyPinned(true);
}

function refreshPinnedState(){
  let isNarrow = false;
  try{ isNarrow = window.matchMedia('(max-width:860px)').matches; }catch(err){}
  if(currentSkin !== 'y2k' || isNarrow){
    if(isToolbarPinned) applyPinned(false);
    return;
  }
  const shouldPin = window.scrollY >= pinThresholdY;
  if(shouldPin !== isToolbarPinned) applyPinned(shouldPin);
}

(function initToolbarPinning(){
  const bigImg = document.querySelector('#cdMenu .cd-decor');
  const dockImg = document.getElementById('cdDockImg');
  if(bigImg && dockImg && !dockImg.src) dockImg.src = bigImg.src;

  measurePinThreshold();
  refreshPinnedState();

  let ticking = false;
  window.addEventListener('scroll', () => {
    if(!ticking){
      ticking = true;
      requestAnimationFrame(() => { refreshPinnedState(); ticking = false; });
    }
  }, { passive:true });

  window.addEventListener('resize', () => {
    measurePinThreshold();
    refreshPinnedState();
  });
})();

  if(skin !== 'classic' && skin !== 'y2k') skin = 'y2k';

  syncToolbarHeight();
  if(typeof measurePinThreshold === 'function'){
    measurePinThreshold();
    refreshPinnedState();
  }
}

function exportHTML(){
  saveNow();
  const exportedData = JSON.stringify(serializeSections(), null, 2);
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('body').classList.remove('edit-mode', 'highlight-mode', 'underline-mode', 'eraser-mode', 'dragging-active');
  clone.querySelector('#sections').innerHTML = '';
  clone.querySelectorAll('#toc a').forEach(a => a.remove());
  clone.querySelectorAll('.mark-popover').forEach(p => p.setAttribute('hidden', ''));
  clone.querySelector('#saveStatus').textContent = '已开启自动保存：编辑、增删后会保存在本浏览器，下次打开自动恢复。';
  const cloneEditBtn = clone.querySelector('#editToggleBtn');
  if(cloneEditBtn){
    cloneEditBtn.innerHTML = '<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
    cloneEditBtn.title = '解锁删除';
    cloneEditBtn.setAttribute('aria-label', '解锁删除');
  }
  let html = '<!DOCTYPE html>\n' + clone.outerHTML;
  html = html.replace(/const seedData = \[[\s\S]*?\n\];\n\nconst container =/, 'const seedData = ' + exportedData + ';\n\nconst container =');
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '翻译推理知识点整理_已编辑.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.html,.htm,.json,text/html,application/json';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    input.remove();
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data = null;
      try{
        data = JSON.parse(String(reader.result));
      }catch(err){
        const m = /const seedData = (\[[\s\S]*?\])\s*;\s*\n\s*\nconst container =/.exec(String(reader.result));
        if(m){
          try{ data = JSON.parse(m[1]); }catch(err2){ data = null; }
        }
      }
      if(!Array.isArray(data) || !data.length){
        alert('导入失败：没能从这个文件里读出数据。请选择"导出当前版本"生成的 html 文件，或对应的 json 数据文件。');
        return;
      }
      if(!confirm('确定要导入这份数据吗？当前页面内容会被替换（导入后仍可用"撤销上一步"恢复到导入前）。')) return;
      pushHistory(serializeSections());
      renderAll(data);
      saveNow();
      if(saveStatus) saveStatus.textContent = '已从文件导入数据。';
    };
    reader.onerror = () => alert('导入失败：文件读取出错。');
    reader.readAsText(file);
  });
  document.body.appendChild(input);
  input.click();
}
</script>
